# Reloading config
unbind r
bind r source-file ~/.tmux.conf

# Create pane
set -g pane-border-format "#{pane_index} #{pane_title}"

# Set prefix to Ctrl+A
unbind C-b
set-option -g prefix C-space
bind C-space send-prefix

# Mouse support
set -g mouse on

# Use vim keys
setw -g mode-keys vi

#jump to another session of detrustion of current
set-option -g detach-on-destroy off

# Scrollback mode 
unbind [
bind-key z copy-mode

# In scrollback mode, 'v' starts selection (like vim visual)
bind -T copy-mode-vi v send-keys -X begin-selection

# Yank selection to clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Esc copy mode
bind -T copy-mode-vi Escape send-keys -X cancel

# Create a new session
bind n command-prompt -p "New session name:" "new-session -s %1"

# Vertical split
unbind %
bind \\ split-window -h 

# Horizontal split key        
unbind '"'
bind "'" split-window -v

# Pane switching ( Alt + arrows)
bind -n M-h  select-pane -L
bind -n M-k    select-pane -U
bind -n M-j  select-pane -D
bind -n M-l select-pane -R

# Help Menu 
bind h display-popup -E -w 60 -h 20 "gum pager --show-line-numbers=false < ~/.tmux/help.txt"

# Resize  panes 
bind -r C-h resize-pane -L 5
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-l resize-pane -R 5

# Pop Up 
bind-key p display-popup -d '#{pane_current_path}' -E

# Create new window (in current path so you don't have to cd again)
bind -n M-c new-window -c "#{pane_current_path}"

# Switch windows — Alt+Shift+h/l for prev/next
bind -n M-H previous-window
bind -n M-L next-window

# Jump directly to window 1-9 with Alt+number
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick rename
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# Kill current window (with confirm so you don't nuke by accident)
bind -n M-x confirm-before -p "kill window #W? (y/n)" kill-window

# Toggle right-hand sidebar pane 
# bind-key t run-shell '~/.tmux/toggle_sidebar.sh'
# bind-key K run-shell '~/.tmux/kill_sidebar.sh'
# bind-key b run-shell "~/.tmux/toggle_sidebar.sh"
# bind-key B run-shell "~/.tmux/toggle_sidebar.sh --three"

# Styling
set-option -g status-position top 

# Default terminal setting for proper coloring
set -g default-terminal "xterm-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

# Colorscheme: Gruvbox dark (medium)
set-option -g status "on"
set-option -g status-style bg=#32302f,fg=#d4be98

# Left and right sections
set-option -g status-left "#[bg=#32302f,fg=#d4be98] #S "
set-option -g status-right "#[bg=#32302f,fg=#d4be98] %Y-%m-%d "

# Window styles
set-window-option -g window-status-style bg=#32302f,fg=#928374
set-window-option -g window-status-current-style bg=#32302f,fg=#d4be98
set-window-option -g window-status-format "#[fg=#928374] #I #W"
set-window-option -g window-status-current-format "#[fg=#d4be98,bold] #W"

# Message style
set-option -g message-style bg=#3c3836,fg=#d4be98
set-option -g message-command-style bg=#3c3836,fg=#d4be98

# Pane borders
set-option -g pane-border-style fg=#3c3836
set-option -g pane-active-border-style fg=#a9b665,bold

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


