# Reloading config
unbind r
bind r source-file ~/.tmux.conf

# Indexing 
set -g base-index 1
setw -g pane-base-index 1
# renumber-windows on

# Create pane
set -g pane-border-format "#{pane_index} #{pane_title}"

# Set prefix to Ctrl+A
unbind C-b
set-option -g prefix C-space
bind C-space send-prefix

# Mouse support
set -g mouse on

# Use vim keys
setw -g mode-keys vi

#jump to another session of detrustion of current
set-option -g detach-on-destroy off

# Scrollback mode 
unbind [
bind-key z copy-mode

# In scrollback mode, 'v' starts selection (like vim visual)
bind -T copy-mode-vi v send-keys -X begin-selection

# Yank selection to clipboard.
#
# This used to pipe into `pbcopy`, which only exists on macOS. On the Arch box
# there is no such binary, so every yank in copy-mode succeeded as far as the
# keybinding was concerned and dropped the text on the floor. OSC 52 replaces
# it because it is the one mechanism that works from both machines: the bytes
# go to whatever terminal is attached, so the selection lands on the clipboard
# of the computer you are actually sitting at, local or over SSH.
#
# The sequence is emitted by a helper rather than by `set-clipboard on`,
# because on tmux 3.7c tmux does not originate one for its own copies. That
# was confirmed by capturing a client's tty across a yank: with set-clipboard
# on, an Ms entry present, and `clipboard` in the client's terminal-features,
# tmux still wrote nothing. See the comment in osc52-copy.sh.
#
# copy-pipe-and-cancel still fills the tmux paste buffer as well, so
# prefix-] keeps working inside tmux.
#
# copy-command is what a bare copy-pipe pipes into, so setting it here also
# fixes the bindings tmux provides by default and this file never mentions:
# Enter, double-click word select, triple-click line select and C-j. Naming
# the helper in one place keeps those from silently going nowhere.
set -g copy-command '~/.tmux/osc52-copy.sh'

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Mouse drags go through the same path, so a drag-select is copied out too.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Esc copy mode
bind -T copy-mode-vi Escape send-keys -X cancel

# Create a new session
bind n command-prompt -p "New session name:" "new-session -s %1"

# Vertical split
unbind %
bind \\ split-window -h 

# Horizontal split key        
unbind '"'
bind "'" split-window -v

# Pane switching ( Alt + arrows)
bind -n M-h  select-pane -L
bind -n M-k    select-pane -U
bind -n M-j  select-pane -D
bind -n M-l select-pane -R

# Help Menu 
bind h display-popup -E -w 62 -h 26 "gum pager --show-line-numbers=false < ~/.tmux/help.txt"

# Resize  panes 
bind -r C-h resize-pane -L 5
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-l resize-pane -R 5

# Pop Up 
bind-key p display-popup -d '#{pane_current_path}' -E

# Create new window (in current path so you don't have to cd again)
bind -n M-c new-window -c "#{pane_current_path}"

# Switch windows — Alt+Shift+h/l for prev/next
bind -n M-H previous-window
bind -n M-L next-window

# Jump directly to window 1-9 with Alt+number
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick rename
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# Kill current window (with confirm so you don't nuke by accident)
bind -n M-x confirm-before -p "kill window #W? (y/n)" kill-window

# Toggle right-hand sidebar pane 
# bind-key t run-shell '~/.tmux/toggle_sidebar.sh'
# bind-key K run-shell '~/.tmux/kill_sidebar.sh'
# bind-key b run-shell "~/.tmux/toggle_sidebar.sh"
# bind-key B run-shell "~/.tmux/toggle_sidebar.sh --three"

# Project session picker
bind S display-popup -E -w 60 -h 20 "~/.tmux/pick_session.sh"

# Styling
set-option -g status-position top 

# Default terminal setting for proper coloring
set -g default-terminal "xterm-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

# Clipboard: accept and forward OSC 52 from an application running inside
# tmux, so a TUI that sets the clipboard itself reaches the outer terminal.
# Verified working by capturing a client's tty: a sequence emitted inside a
# pane arrives at the client unchanged.
#
# This does NOT cover tmux's own copies. `on` is documented to make tmux set
# the terminal clipboard for those too, and on tmux 3.7c it does not, which is
# why copy-mode yanks go through the copy-command helper instead. The default
# `external` would additionally ignore an inner application's sequence, so
# `on` is still the setting to want here.
set -g set-clipboard on

# tmux only emits OSC 52 for a terminal it believes can accept it, and the
# usual reason `set-clipboard on` looks correct and does nothing is that the
# outer TERM is not one it knows. tmux 3.7 already declares clipboard for
# xterm*, which covers the xterm-256color both kitty and alacritty are set to,
# so this line is insurance for the ones it does not know rather than a fix for
# today. Adding a TERM here is the first thing to try if copy stops working
# from a new machine.
set -ga terminal-features ",xterm-256color:clipboard,alacritty:clipboard,xterm-kitty:clipboard,tmux-256color:clipboard"

# Let an inner application's own escape sequences through untouched, so a TUI
# that speaks OSC 52 itself is not swallowed by tmux on the way out.
set -g allow-passthrough on

# Colorscheme: Gruvbox dark (medium)
set-option -g status "on"
set-option -g status-style bg=#32302f,fg=#d4be98

# Left and right sections
set-option -g status-left "#[bg=#32302f,fg=#d4be98] #S "
set-option -g status-right "#[bg=#32302f,fg=#d4be98] %Y-%m-%d "

# Window styles
set-window-option -g window-status-style bg=#32302f,fg=#928374
set-window-option -g window-status-current-style bg=#32302f,fg=#d4be98
set-window-option -g window-status-format "#[fg=#928374] #I #W"
set-window-option -g window-status-current-format "#[fg=#d4be98,bold] #W"

# Message style
set-option -g message-style bg=#3c3836,fg=#d4be98
set-option -g message-command-style bg=#3c3836,fg=#d4be98

# Pane borders
set-option -g pane-border-style fg=#3c3836
set-option -g pane-active-border-style fg=#a9b665,bold

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


