# Port of ~/.config/alacritty/alacritty.toml
# Theme: Gruvbox Material Medium Dark

# --- colors -------------------------------------------------------------
background            #282828
foreground            #d4be98

# normal
color0                #3c3836
color1                #ea6962
color2                #a9b665
color3                #d8a657
color4                #7daea3
color5                #d3869b
color6                #89b482
color7                #d4be98

# bright (same as normal, matching your alacritty theme)
color8                #3c3836
color9                #ea6962
color10               #a9b665
color11               #d8a657
color12               #7daea3
color13               #d3869b
color14               #89b482
color15               #d4be98

# --- font ---------------------------------------------------------------
font_family           Hack Nerd Font Mono
font_size             10

# --- window -------------------------------------------------------------
# remember_window_size MUST be no, or kitty ignores initial_window_* and
# restores whatever size it last had.
remember_window_size    no
initial_window_width    60c
initial_window_height   20c
window_padding_width    0
hide_window_decorations yes
background_opacity      0.90
background_blur         1

# --- cursor -------------------------------------------------------------
cursor_shape             block
cursor_stop_blinking_after 0
cursor_shape_unfocused   hollow

# --- shell --------------------------------------------------------------
term                  xterm-256color
shell                 /usr/bin/tmux new-session

# --- strip the parts you didn't want ------------------------------------
# kitty ships a lot on by default. These turn the extras off so it behaves
# like a plain terminal.
tab_bar_style         hidden
shell_integration     disabled
update_check_interval 0
confirm_os_window_close 0
allow_remote_control  no
enable_audio_bell     no
